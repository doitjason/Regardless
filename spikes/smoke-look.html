<!doctype html>
<meta charset="utf-8">
<title>헵타포드 B — 스모크 룩 스파이크</title>
<style>
  html,body{margin:0;background:#0c0f10;color:#8b9799;font:13px/1.6 system-ui,sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
  .frame{position:relative;background:#000;line-height:0;width:100%;max-width:1520px}
  canvas{display:block;width:100%;height:auto}
  .bar{position:absolute;left:0;right:0;height:1.1%;background:#14181a;z-index:2}
  .bar.t{top:0} .bar.b{bottom:0}
  .cap{opacity:.55;font-size:12px;text-align:center}
</style>
<div class="wrap">
  <div class="frame">
    <div class="bar t"></div>
    <canvas id="c"></canvas>
    <div class="bar b"></div>
  </div>
  <div class="cap">
    획 자체가 먹물 · 넓고 불규칙한 획 · 붓털처럼 갈라진 끝 · 결을 따르는 비등방 노이즈<br>
    <span style="opacity:.7">스페이스 — 정지 / 재생 &nbsp;·&nbsp; G — 12분할 격자 &nbsp;·&nbsp; S — PNG 저장</span>
  </div>
</div>

<script type="x-shader/x-fragment" id="fs">#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uRes;
uniform float uT;
uniform float uGrid;

// ── 노이즈 ──
vec2 hash2(vec2 p){
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}
float gnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(dot(hash2(i + vec2(0,0)), f - vec2(0,0)),
                 dot(hash2(i + vec2(1,0)), f - vec2(1,0)), u.x),
             mix(dot(hash2(i + vec2(0,1)), f - vec2(0,1)),
                 dot(hash2(i + vec2(1,1)), f - vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p, int oct){
  float a = 0.5, s = 0.0;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 8; i++){
    if (i >= oct) break;
    s += a * gnoise(p);
    p = m * p;
    a *= 0.5;
  }
  return s;
}
// fbm은 실제로 대체로 ±0.25 범위다. 0..1로 펴서 임계값을 쓸 수 있게 한다.
float n01(float v){ return clamp(v * 1.9 + 0.5, 0.0, 1.0); }

// ── 골격 SDF ──
float sdSeg(vec2 p, vec2 a, vec2 b, float w){
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - w;
}
vec2 bez(vec2 a, vec2 b, vec2 c, float t){
  float u = 1.0 - t;
  return u*u*a + 2.0*u*t*b + t*t*c;
}
// 굵기가 줄어드는 넓은 획
float sdBranch(vec2 p, vec2 a, vec2 b, vec2 c, float w0, float w1){
  float d = 1e9;
  vec2 prev = a;
  for (int i = 1; i <= 9; i++){
    float t = float(i) / 9.0;
    vec2 cur = bez(a, b, c, t);
    d = min(d, sdSeg(p, prev, cur, mix(w0, w1, t)));
    prev = cur;
  }
  return d;
}
// 붓털처럼 갈라진 끝 — 가는 가지가 부챗살로 퍼진다
float sdSplay(vec2 p, vec2 at, float baseAng, float len, float spread, float w){
  float d = 1e9;
  for (int i = 0; i < 5; i++){
    float f = (float(i) - 2.0) / 2.0;            // -1 .. 1
    float a = baseAng + f * spread;
    float L = len * (0.55 + 0.45 * (1.0 - abs(f)));
    d = min(d, sdSeg(p, at, at + vec2(cos(a), sin(a)) * L, w));
  }
  return d;
}

const float R = 0.58;

// 링 굵기 — 사인파가 아니라 노이즈로. 극단적으로 변한다.
// 첨부 스크린샷의 획은 가장 두꺼운 곳이 반경의 8~9%에 달하고
// 가는 곳은 그 1/4도 안 된다.
float ringW(float ang){
  vec2 u = vec2(cos(ang), sin(ang));
  float a = fbm(u * 2.4 + vec2(7.0, 3.0), 4);
  float b = fbm(u * 6.0 + vec2(23.0, 11.0), 3);
  float c = fbm(u * 14.0 + vec2(51.0, 31.0), 2);
  return clamp(0.0320 + a * 0.052 + b * 0.024 + c * 0.010, 0.0085, 0.0560);
}

float sdShape(vec2 p){
  float ang = atan(p.y, p.x);
  float d = abs(length(p) - R) - ringW(ang);

  // 링 자체가 완벽한 원이 아니다 — 저주파로 살짝 찌그러뜨린다
  // (반경 변조는 위 length(p) 대신 아래 항으로 보정)
  d -= fbm(vec2(cos(ang), sin(ang)) * 1.8 + 61.0, 3) * 0.020;

  // ── 12시 · 행위 — 가장 넓고 굵은 획 ──
  d = min(d, sdBranch(p, vec2(-0.055, 0.560), vec2(0.090, 0.905), vec2(0.330, 0.815), 0.0560, 0.0075));
  d = min(d, sdBranch(p, vec2( 0.055, 0.575), vec2(0.195, 0.740), vec2(0.340, 0.690), 0.0250, 0.0045));
  d = min(d, sdSplay(p, vec2(0.330, 0.815), 0.55, 0.115, 0.85, 0.0055));
  d = min(d, sdSplay(p, vec2(0.340, 0.690), 0.10, 0.075, 0.95, 0.0040));

  // ── 2시 · 주체 ──
  d = min(d, sdBranch(p, vec2(0.485, 0.300), vec2(0.755, 0.420), vec2(0.795, 0.205), 0.0445, 0.0060));
  d = min(d, sdSplay(p, vec2(0.795, 0.205), -1.15, 0.100, 0.90, 0.0048));

  // ── 8시 · 대상 ──
  d = min(d, sdBranch(p, vec2(-0.490, -0.300), vec2(-0.790, -0.390), vec2(-0.700, -0.615), 0.0480, 0.0062));
  d = min(d, sdSplay(p, vec2(-0.700, -0.615), -1.30, 0.105, 0.95, 0.0050));

  // ── 접선 호 — 링을 따라 감기는 넓은 덩어리 ──
  d = min(d, sdBranch(p, vec2(0.270, 0.530), vec2(0.495, 0.415), vec2(0.575, 0.215), 0.0175, 0.0175));
  d = min(d, sdBranch(p, vec2(-0.575, 0.195), vec2(-0.655, -0.025), vec2(-0.565, -0.230), 0.0155, 0.0155));

  // ── 작은 고리 (생물성 표지) ──
  d = min(d, abs(length(p - vec2(0.425, 0.625)) - 0.034) - 0.0090);

  return d;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  p *= 1.62;

  float d = sdShape(p);

  // ── 획의 결 방향 ──
  // 먹물은 획을 따라 끌린다. 결을 만들려면 획의 접선 방향을 알아야 한다.
  // 형태 근처에서만 SDF 기울기를 구한다 (비용 절감).
  vec2 tang = vec2(1.0, 0.0);
  if (d < 0.13) {
    float e = 0.0016;
    vec2 g = vec2(sdShape(p + vec2(e, 0.0)) - sdShape(p - vec2(e, 0.0)),
                  sdShape(p + vec2(0.0, e)) - sdShape(p - vec2(0.0, e)));
    if (length(g) > 1e-6) { g = normalize(g); tang = vec2(-g.y, g.x); }
  }
  vec2 nrm = vec2(-tang.y, tang.x);
  // 결을 따라 늘어난 좌표계 — 획 방향으로는 완만하게, 가로로는 촘촘하게
  vec2 pa = vec2(dot(p, tang) * 3.2, dot(p, nrm) * 26.0);

  // ── 도메인 워프 ──
  vec2 w1 = vec2(fbm(p * 2.2 + vec2(11.3, 4.1) + uT * 0.030, 4),
                 fbm(p * 2.2 + vec2(27.7, 19.2) - uT * 0.024, 4));
  vec2 w2 = vec2(fbm(p * 5.0 + w1 * 1.1 + vec2(3.1, 51.7) + uT * 0.055, 4),
                 fbm(p * 5.0 + w1 * 1.1 + vec2(41.9, 7.3) - uT * 0.045, 4));

  float nLow  = fbm(p * 2.4 + w1 * 0.9, 4);
  float nMid  = fbm(p * 8.5 + w2 * 2.2, 5);
  float nHi   = fbm(p * 21.0 + w2 * 3.4, 4);
  float nFil  = fbm(p * 15.0 + w2 * 5.0 + nLow * 2.2, 5);
  // 결 — 획을 따라 흐르는 먹물 줄무늬
  float nGrain = fbm(pa + w2 * 2.0, 5);

  float od = max(0.0, d);

  // ── 획 자체를 먹물로 만든다 ──
  // 핵심: 깨끗한 도형을 만들고 그 위에 아지랑이를 덮는 게 아니다.
  // 획의 내부 밀도가 처음부터 불균일해야 한다 — 짙은 심, 옅은 구멍, 결.
  float interior = smoothstep(0.010, -0.030, d + nMid * 0.022 + nHi * 0.014);

  // 먹물의 농담. 대비를 강하게 줘서 획 안에 심과 구멍이 생긴다.
  float substance = n01(nGrain * 1.35 + nLow * 0.55);
  substance = pow(substance, 0.70);

  // 획 몸통 — 완전히 채우지 않되 바닥을 높게 잡는다.
  // 바닥이 낮으면 구멍이 너무 커져서 형태를 읽을 수 없다.
  float body = interior * (0.62 + 0.38 * substance);

  // 짙은 심 — 획 중앙부에서 결이 겹치는 자리
  float coreInk = smoothstep(-0.004, -0.030, d) * smoothstep(0.34, 0.86, substance);

  // 가장자리 보풀 — 획 경계가 먹물로 풀어진다
  float fray = pow(smoothstep(0.26, 0.92, n01(nHi)), 1.4) * exp(-od * 34.0);

  // 실오라기 — 결 방향으로 뻗는다
  float wisp = pow(smoothstep(0.38, 0.96, n01(nFil)), 1.45) * exp(-od * 13.0);

  // 긴 연기 기둥 — 각도별 게이트로 몇 군데에서만 멀리 뻗는다
  vec2 dir = normalize(p + vec2(1e-5));
  float gate = n01(fbm(dir * 2.3 + vec2(17.0, 5.0), 3));
  float plume = pow(smoothstep(0.44, 1.00, n01(nFil)), 1.2)
              * exp(-od * 4.2)
              * smoothstep(0.46, 0.88, gate);

  // 알파 누적(over)
  float dens = 1.0
    - (1.0 - body)
    * (1.0 - coreInk * 0.86)
    * (1.0 - fray   * 0.70)
    * (1.0 - wisp   * 0.62)
    * (1.0 - plume  * 0.50);

  // 위쪽이 더 흩어지게
  dens *= 1.0 - smoothstep(0.34, 1.05, p.y) * 0.18;
  // 저주파 소실 — 획의 일부가 안개에 먹힌다.
  // 너무 세게 걸면 형태 전체가 유령처럼 사라진다.
  dens *= 0.80 + 0.20 * n01(fbm(p * 1.45 + vec2(41.0, 13.0) + uT * 0.018, 3));

  // ── 배경 안개 ──
  float band = uv.y;
  vec3 bg = mix(vec3(0.335, 0.384, 0.390), vec3(0.612, 0.655, 0.652), smoothstep(0.04, 0.66, band));
  bg = mix(bg, vec3(0.470, 0.512, 0.514), smoothstep(0.72, 0.99, band));
  bg += fbm(p * 1.15 + vec2(7.0, 2.0) + uT * 0.02, 4) * 0.075;
  bg = mix(bg, vec3(0.250, 0.284, 0.292), smoothstep(0.950, 0.996, band));

  // 12분할 격자 (개발자 뷰)
  if (uGrid > 0.5) {
    float ang = atan(p.y, p.x) + 1.5707963;
    float seg = ang / (3.14159265 / 6.0);
    float line = abs(fract(seg) - 0.5);
    float g1 = smoothstep(0.016, 0.0, line) * smoothstep(0.86, 0.80, length(p));
    float dash = step(0.5, fract(length(p) * 46.0));
    bg = mix(bg, vec3(0.72, 0.74, 0.72), g1 * dash * 0.55);
  }

  // 순수 검정이 아니라 탈색된 청록 계열
  vec3 ink = vec3(0.062, 0.079, 0.083);
  // 짙은 심은 조금 더 어둡게 — 먹물의 농담
  ink = mix(ink, vec3(0.026, 0.036, 0.040), clamp(coreInk, 0.0, 1.0));

  vec3 col = mix(bg, ink, dens);

  // 주변 감광
  col *= 1.0 - 0.16 * smoothstep(0.55, 1.35, length(p * vec2(0.62, 1.0)));
  // 필름 그레인
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.016;

  outColor = vec4(col, 1.0);
}
</script>

<script>
const cvs = document.getElementById('c');
const gl = cvs.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
if (!gl) { document.body.innerHTML = '<p style="padding:20px">WebGL2를 쓸 수 없습니다.</p>'; throw 0; }

const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim());
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uT = gl.getUniformLocation(prog, 'uT');
const uGrid = gl.getUniformLocation(prog, 'uGrid');

let T = 3.7, grid = 0;

function draw(t) {
  gl.viewport(0, 0, cvs.width, cvs.height);
  gl.uniform2f(uRes, cvs.width, cvs.height);
  gl.uniform1f(uT, t);
  gl.uniform1f(uGrid, grid);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function resize() {
  const w = Math.max(320, Math.round(cvs.clientWidth));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = Math.round(w * dpr);
  cvs.height = Math.round(w * dpr * 9 / 16);
  draw(T);
}

cvs.style.aspectRatio = '16 / 9';
new ResizeObserver(resize).observe(cvs);
resize();

let animating = true;
const t0 = performance.now();
(function loop() {
  if (animating) { T = 3.7 + (performance.now() - t0) / 1000; draw(T); }
  requestAnimationFrame(loop);
})();

window.addEventListener('keydown', (e) => {
  if (e.key === ' ') { animating = !animating; e.preventDefault(); }
  if (e.key === 'g' || e.key === 'G') { grid = grid > 0.5 ? 0 : 1; draw(T); }
  if (e.key === 's' || e.key === 'S') {
    draw(T);
    const a = document.createElement('a');
    a.download = `heptapod-smoke-${T.toFixed(2)}.png`;
    a.href = cvs.toDataURL('image/png');
    a.click();
  }
});
window.__drawAt = (t) => { animating = false; T = t; draw(t); };
</script>
